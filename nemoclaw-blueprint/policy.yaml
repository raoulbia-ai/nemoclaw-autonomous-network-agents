# Sandbox-only network policy.
# The mock Ireland network runs INSIDE the sandbox on 127.0.0.1:8090, so it
# does not appear here — loopback within a single network namespace is not
# subject to egress filtering. The only outbound destinations are the
# external data sources the agents enrich their context with.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /sandbox/.openclaw
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /sandbox/.openclaw-data

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  weather_apis:
    name: weather-data
    endpoints:
      - host: www.met.ie
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
      - host: api.open-meteo.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
    binaries:
      - path: /usr/local/bin/node
      - path: /usr/bin/node
      - path: /usr/bin/curl

  events_api:
    name: ticketmaster
    endpoints:
      - host: app.ticketmaster.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
    binaries:
      - path: /usr/local/bin/node
      - path: /usr/bin/node

  traffic_api:
    name: tomtom-traffic
    endpoints:
      - host: api.tomtom.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
    binaries:
      - path: /usr/local/bin/node
      - path: /usr/bin/node
